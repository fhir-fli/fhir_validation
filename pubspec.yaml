name: fhir_validation
description: FHIR resource validation against StructureDefinitions (structure, cardinality, bindings, extensions, invariants) for every FHIR version, over the fhir_node reflection contract.
version: 0.13.0
homepage: https://www.fhirfli.dev/
repository: https://github.com/fhir-fli/fhir_validation
issue_tracker: https://github.com/fhir-fli/fhir_validation/issues

topics:
  - fhir
  - hl7
  - healthcare
  - validation
  - interoperability

environment:
  sdk: ^3.7.0

dependencies:
  characters: ^1.4.0
  collection: ^1.19.1
  fhir_node: ^0.6.1
  fhir_path: ^0.15.0
  http: ^1.6.0

dev_dependencies:
  test: ^1.29.0
  very_good_analysis: ^10.1.0
