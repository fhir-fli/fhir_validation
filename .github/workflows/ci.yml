# Added 2026-10-04 (family hardening): the same gate as fhir_r4's ci.yml.
# fhir_node 0.6.1 and fhir_path 0.15.0 are taken from their repositories
# until they are on pub.dev (remove the override step at that release).
name: CI
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Override unpublished dependencies
        run: |
          {
            echo "# Generated by CI: fhir_node and fhir_path as they are on main."
            echo "dependency_overrides:"
            echo "  fhir_node:"
            echo "    git:"
            echo "      url: https://github.com/fhir-fli/fhir_node.git"
            echo "      ref: main"
            echo "  fhir_path:"
            echo "    git:"
            echo "      url: https://github.com/fhir-fli/fhir_path.git"
            echo "      ref: main"
          } > pubspec_overrides.yaml

      - name: Format, analyze & test
        run: |
          dart pub get
          for f in lib test example bin tool; do
            if [ -d "$f" ]; then
              dart format --output=none --set-exit-if-changed "$f"
            fi
          done
          dart analyze
          dart test
